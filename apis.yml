name: Hidrate
description: >-
  HidrateSpark is the world's smartest water bottle brand, tracking daily water
  intake with a Bluetooth-connected sensor puck that glows to remind you to drink
  and syncs to the HidrateSpark hydration app, Fitbit, and Apple Watch. The
  company (originally Hidrate, Inc., a Techstars-backed startup) sells its smart
  bottles and accessories through a Shopify-hosted direct-to-consumer storefront
  at hidratespark.com. It does not publish a first-party developer or product API;
  the only machine-facing surface is the Shopify platform layer — OIDC/OAuth
  customer accounts and the Universal Commerce Protocol (UCP) agent-commerce
  endpoints that let buyer-approved AI shopping agents browse and check out.
